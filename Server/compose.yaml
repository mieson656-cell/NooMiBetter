services:
  noomibetter-relay:
    build: .
    container_name: noomibetter-relay
    restart: unless-stopped
    environment:
      PORT: "8787"
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
